# Dependabot version and security updates.
#
# Python packages, npm (Tailwind, used to build the committed stylesheet), the container base images
# and the GitHub Actions used by the workflows are checked weekly. Minor and patch updates are grouped
# into one pull request per ecosystem to keep the noise down; major updates get their own.
#
# Not covered: the tool versions pinned as ARGs in the Dockerfile (nuclei, trufflehog, testssl.sh,
# WhatWeb, BBOT) because Dependabot does not read build arguments; bump those by hand.
version: 2

updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/test"
      - "/test/acceptance"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    ignore:
      # The Python version is chosen on purpose (see the Dockerfile); take patch releases only.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        update-types: ["minor", "patch"]
