{# Settings > Modules: globally enable/disable modules, with filters. #}
<div x-data='moduleSettings({{ modules | tojson }})'>

  <div class="flex items-start justify-between mb-4 gap-4">
    <div>
      <h2 class="text-lg font-semibold text-slate-800 dark:text-slate-100">Modules</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
        Disabled modules are hidden from the New Scan page and are never run, even by API calls.
      </p>
    </div>
    <span class="text-xs text-slate-500 dark:text-slate-400 whitespace-nowrap pt-1"
          x-text="enabledCount() + ' of ' + all.length + ' enabled'"></span>
  </div>

  <input type="search" x-model="q" placeholder="Search modules…"
         class="w-full mb-3 rounded-md border border-slate-300 dark:border-sf-border bg-white dark:bg-sf-surface
                text-slate-800 dark:text-slate-100 text-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sf-accent">

  {# Filters #}
  <div class="space-y-2 mb-4 text-xs">
    <template x-for="grp in filterGroups" :key="grp.id">
      <div class="flex flex-wrap items-center gap-1.5">
        <span class="w-16 text-slate-500 dark:text-slate-400" x-text="grp.label"></span>
        <template x-for="opt in grp.options" :key="opt.id">
          <button type="button" @click="toggleFilter(grp.id, opt.id)"
                  :class="filters[grp.id] === opt.id ? opt.on : 'border-slate-300 dark:border-sf-border text-slate-500 dark:text-slate-400 hover:border-slate-400'"
                  class="px-2.5 py-1 rounded-full border transition-colors">
            <span x-text="opt.label"></span>
            <span class="opacity-60" x-text="'(' + count(grp.id, opt.id) + ')'"></span>
          </button>
        </template>
      </div>
    </template>
  </div>

  {# Bulk actions apply to whatever is currently shown #}
  <div class="flex items-center gap-2 mb-3">
    <span class="text-xs text-slate-500 dark:text-slate-400" x-text="shown().length + ' shown'"></span>
    <button type="button" @click="setMany(shown(), true)"
            class="text-xs px-2.5 py-1 rounded border border-slate-300 dark:border-sf-border text-slate-600 dark:text-slate-300 hover:border-sf-accent">Enable shown</button>
    <button type="button" @click="setMany(shown(), false)"
            class="text-xs px-2.5 py-1 rounded border border-slate-300 dark:border-sf-border text-slate-600 dark:text-slate-300 hover:border-sf-accent">Disable shown</button>
    <span class="text-xs text-red-500" x-text="err"></span>
  </div>

  <div class="divide-y divide-slate-200 dark:divide-sf-border border border-slate-200 dark:border-sf-border rounded-lg">
    <template x-for="m in shown()" :key="m.id">
      <div class="flex items-center gap-3 px-3 py-2" :class="m.disabled ? 'opacity-60' : ''">
        <button type="button" role="switch" :aria-checked="!m.disabled" @click="setMany([m], m.disabled)"
                :class="m.disabled ? 'bg-slate-300 dark:bg-slate-600' : 'bg-sf-accent'"
                class="relative inline-flex h-5 w-9 shrink-0 rounded-full transition-colors">
          <span :class="m.disabled ? 'translate-x-0.5' : 'translate-x-4'"
                class="inline-block h-4 w-4 mt-0.5 rounded-full bg-white transition-transform"></span>
        </button>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5 flex-wrap">
            <span class="text-sm font-medium text-slate-800 dark:text-slate-100" x-text="m.name"></span>
            <span x-show="m.pricing === 'free'" class="text-[10px] px-1.5 py-0.5 rounded bg-green-500/20 text-green-400 border border-green-500/50 leading-none">FREE</span>
            <span x-show="m.pricing === 'free_key'" class="text-[10px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/50 leading-none">FREE TIER</span>
            <span x-show="m.pricing === 'paid'" class="text-[10px] px-1.5 py-0.5 rounded bg-red-500/20 text-red-400 border border-red-500/50 leading-none">PAID</span>
            <span x-show="m.pricing === 'local'" class="text-[10px] px-1.5 py-0.5 rounded bg-slate-500/10 text-slate-400 border border-slate-500/20 leading-none">LOCAL</span>
            <span x-show="m.requiresKey && !m.keyConfigured" class="text-[10px] text-amber-500">no key</span>
            <span x-show="m.requiresKey && m.keyConfigured" class="text-[10px] text-sf-success">key set</span>
          </div>
          <p class="text-xs text-slate-400 dark:text-slate-500 truncate" x-text="m.summary"></p>
        </div>
      </div>
    </template>
    <p x-show="shown().length === 0" class="text-sm text-slate-400 text-center py-6">No modules match.</p>
  </div>
</div>

<script>
function moduleSettings(data) {
  return {
    all: Object.entries(data).map(([id, m]) => ({ id, ...m }))
             .sort((a, b) => a.name.localeCompare(b.name)),
    q: '', err: '',
    filters: { state: '', key: '', cost: '' },
    filterGroups: [
      { id: 'state', label: 'State', options: [
        { id: 'enabled', label: 'Enabled', on: 'border-sf-accent text-sf-accent bg-sf-accent/10' },
        { id: 'disabled', label: 'Disabled', on: 'border-sf-accent text-sf-accent bg-sf-accent/10' } ] },
      { id: 'key', label: 'Key', options: [
        { id: 'active', label: 'Active (usable)', on: 'border-sf-accent text-sf-accent bg-sf-accent/10' },
        { id: 'nokey', label: 'No key', on: 'border-sf-accent text-sf-accent bg-sf-accent/10' } ] },
      { id: 'cost', label: 'Cost', options: [
        { id: 'free', label: 'Free', on: 'border-green-500 text-green-400 bg-green-500/10' },
        { id: 'free_key', label: 'Free tier', on: 'border-blue-500 text-blue-400 bg-blue-500/10' },
        { id: 'paid', label: 'Paid', on: 'border-red-500 text-red-400 bg-red-500/10' },
        { id: 'local', label: 'Local', on: 'border-slate-400 text-slate-300 bg-slate-500/10' } ] },
    ],
    init() {},
    // "Active" = needs no key, or its key is configured. "No key" = key needed but missing.
    test(m, g, v) {
      if (g === 'state') return v === 'enabled' ? !m.disabled : m.disabled;
      if (g === 'key') return v === 'active' ? (!m.requiresKey || m.keyConfigured) : (m.requiresKey && !m.keyConfigured);
      return m.pricing === v;
    },
    matches(m, skip) {
      for (const g of Object.keys(this.filters)) {
        if (g !== skip && this.filters[g] && !this.test(m, g, this.filters[g])) return false;
      }
      const q = this.q.trim().toLowerCase();
      return !q || (m.name + ' ' + m.id + ' ' + m.summary).toLowerCase().includes(q);
    },
    shown() { return this.all.filter(m => this.matches(m, null)); },
    count(g, v) { return this.all.filter(m => this.matches(m, g) && this.test(m, g, v)).length; },
    enabledCount() { return this.all.filter(m => !m.disabled).length; },
    toggleFilter(g, v) { this.filters[g] = this.filters[g] === v ? '' : v; },
    async setMany(list, enabled) {
      this.err = '';
      const ids = list.map(m => m.id);
      if (!ids.length) return;
      try {
        const r = await fetch('/api/modulestate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': window.__SF_CSRF_TOKEN__ || '' },
          body: JSON.stringify({ modules: ids, enabled }),
        });
        const d = await r.json();
        if (d[0] !== 'SUCCESS') throw new Error(d[1] || 'failed');
        const off = new Set(d[1]);
        this.all.forEach(m => { m.disabled = off.has(m.id); });
      } catch (e) { this.err = 'Save failed: ' + (e.message || e); }
    },
  };
}
</script>
